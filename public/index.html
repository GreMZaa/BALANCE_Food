<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BALANCE • Premium Fitness & Detox v2</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    :root {
      --bg-dark: #0b0f0d;
      --card-bg: #141a17;
      --card-border: rgba(255, 255, 255, 0.07);
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-gold: #f59e0b;
      --text-white: #ffffff;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      padding-bottom: 120px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 13, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-white);
    }
    .brand-logo span {
      color: var(--accent-green);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-presentation {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .kcal-badge {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Hero */
    .hero-banner {
      margin: 16px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(20, 26, 23, 0.8) 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
    }

    .hero-banner h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-green);
      margin-bottom: 4px;
    }

    .hero-banner p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Categories Horizontal Bar */
    .categories-bar {
      display: flex;
      overflow-x: auto;
      padding: 0 16px 14px 16px;
      gap: 8px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active {
      background: var(--accent-green);
      color: #000000;
      font-weight: 700;
      border-color: var(--accent-green);
    }

    /* Menu Grid */
    .menu-grid {
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .food-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-img-wrap {
      width: 100%;
      height: 190px;
      overflow: hidden;
      background: #1a221e;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .item-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* KBJU Badges */
    .kbju-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .kbju-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .kbju-pill.kcal {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.25);
      color: var(--accent-gold);
      font-weight: 700;
    }

    /* Price and Button */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    .price-tag {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: var(--text-white);
    }

    .btn-add {
      background: var(--accent-green);
      color: #000000;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-add:active {
      background: var(--accent-green-hover);
    }

    /* Cart Bar */
    .cart-wrapper {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 99;
    }

    .cart-btn {
      background: var(--accent-green);
      color: #000000;
      border: none;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
    }

    /* Presentation Modal */
    .slides-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 13, 0.96);
      backdrop-filter: blur(20px);
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .slides-modal.active { display: flex; }

    .slide-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      margin: auto 0;
    }

    .slide-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      color: var(--accent-green);
      margin-bottom: 10px;
    }

    .slide-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .slides-controls {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn-slide {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">BAL<span>Ω</span>NCE</div>
    <div class="header-actions">
      <button class="btn-presentation" onclick="toggleSlides(true)">✨ Слайды</button>
      <div class="kcal-badge">
        <span>🔥</span>
        <span id="kcalVal">0 kcal</span>
      </div>
    </div>
  </header>

  <!-- Presentation Modal -->
  <div class="slides-modal" id="slidesModal">
    <div class="slide-card">
      <h3 id="slideTitle">1. Наше УТП & КБЖУ</h3>
      <p id="slideDesc">BALANCE Food — первое фитнес-кафе в Нячанге с профессиональным подсчетом калорий, белков, жиров и углеводов в каждом блюде.</p>
    </div>
    <div class="slides-controls">
      <button class="btn-slide" onclick="prevSlide()">← Назад</button>
      <button class="btn-slide" onclick="nextSlide()">Далее →</button>
      <button class="btn-slide" style="background: rgba(255,255,255,0.1); color:#fff;" onclick="toggleSlides(false)">✕</button>
    </div>
  </div>

  <div class="hero-banner">
    <h2>FITNESS • PROTEIN • DETOX</h2>
    <p>Специализированное фитнес-кафе в Нячанге. Точный подсчет КБЖУ и экспресс-доставка за 30 минут 🛵</p>
  </div>

  <div class="categories-bar" id="categoriesBar"></div>

  <div class="menu-grid" id="menuGrid"></div>

  <div class="cart-wrapper">
    <button class="cart-btn" onclick="checkoutOrder()">
      <span>🛒 Корзина (<span id="cartQty">0</span>)</span>
      <span id="cartSum">0 VND</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let menuData = null;
    let cart = [];
    let currentSlide = 0;

    const slideContent = [
      { title: "1. Наше УТП & КБЖУ", desc: "BALANCE Food — специализированное фитнес-кафе в Нячанге. Мы высчитываем КБЖУ каждого блюда и напитка." },
      { title: "2. Фитнес-вафли без глютена", desc: "Уникальная рецептура на тофу или домашнем твороге с начинками из лосося, сочного страуса, вареных креветок или шоколада." },
      { title: "3. Функциональные бустеры", desc: "Добавляйте Collagen, GABA, Lion's Mane (Ежовик гребенчатый) и Protein в ваши смузи для идеального самочувствия." },
      { title: "4. Экспресс-доставка по Нячангу", desc: "Доставляем за 30 минут по центру Нячанга, Северному району и Анвьену. Автоматическая оплата VietQR." }
    ];

    function toggleSlides(show) {
      document.getElementById('slidesModal').classList.toggle('active', show);
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % slideContent.length;
      updateSlideView();
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + slideContent.length) % slideContent.length;
      updateSlideView();
    }

    function updateSlideView() {
      document.getElementById('slideTitle').innerText = slideContent[currentSlide].title;
      document.getElementById('slideDesc').innerText = slideContent[currentSlide].desc;
    }

    const customImages = {
      'waffle-salmon': '/waffle_salmon.png',
      'waffle-mexican': '/waffle_mexican.png',
      'waffle-chicken': '/waffle_chicken.png',
      'waffle-julienne': '/waffle_julienne.png',
      'waffle-shrimp': '/waffle_shrimp.png',
      'waffle-ostrich': '/waffle_ostrich.png',
      'waffle-chocolate': '/waffle_chocolate.png',
      'green-quinoa-bowl': '/green_bowl.png'
    };

    async function fetchMenu() {


      try {
        const res = await fetch('/api/menu');
        menuData = await res.json();
        renderCategories();
        renderCategoryItems(menuData.categories[0].id);
      } catch(e) {
        console.error(e);
      }
    }

    function renderCategories() {
      const container = document.getElementById('categoriesBar');
      container.innerHTML = menuData.categories.map((c, i) => `
        <button class="chip-btn ${i === 0 ? 'active' : ''}" onclick="switchCategory('${c.id}', this)">
          ${c.title_ru}
        </button>
      `).join('');
    }

    function switchCategory(catId, btn) {
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCategoryItems(catId);
    }

    function renderCategoryItems(catId) {
      const container = document.getElementById('menuGrid');
      const cat = menuData.categories.find(c => c.id === catId);
      if (!cat) return;

      container.innerHTML = cat.items.map(item => {
        const price = item.price_vnd || item.price_m || 0;
        const kcal = item.kcal || item.kcal_m || 0;
        const imgUrl = customImages[item.id];

        return `
          <div class="food-card">
            ${imgUrl ? `
              <div class="card-img-wrap">
                <img src="${imgUrl}" alt="${item.title_ru}">
              </div>
            ` : ''}
            
            <div class="card-body">
              <div>
                <div class="item-title">${item.title_ru}</div>
                ${item.description_ru ? `<div class="item-desc">${item.description_ru}</div>` : ''}
                
                <div class="kbju-row">
                  ${kcal ? `<div class="kbju-pill kcal">🔥 ${kcal} kcal</div>` : ''}
                  ${item.protein ? `<div class="kbju-pill">Б: ${item.protein}g</div>` : ''}
                  ${item.fat ? `<div class="kbju-pill">Ж: ${item.fat}g</div>` : ''}
                  ${item.carbs ? `<div class="kbju-pill">У: ${item.carbs}g</div>` : ''}
                </div>
              </div>

              <div class="card-footer">
                <div class="price-tag">${price.toLocaleString()} VND</div>
                <button class="btn-add" onclick="addItem('${item.id}', ${price}, ${kcal})">
                  + В корзину
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function addItem(id, price, kcal) {
      cart.push({ id, price, kcal });
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      updateCartDisplay();
    }

    function updateCartDisplay() {
      document.getElementById('cartQty').innerText = cart.length;
      const totalVnd = cart.reduce((sum, item) => sum + item.price, 0);
      const totalKcal = cart.reduce((sum, item) => sum + item.kcal, 0);

      document.getElementById('cartSum').innerText = totalVnd.toLocaleString() + ' VND';
      document.getElementById('kcalVal').innerText = totalKcal + ' kcal';
    }

    function checkoutOrder() {
      if (cart.length === 0) {
        tg.showAlert("Выберите блюда из меню");
        return;
      }
      tg.sendData(JSON.stringify({ action: 'CHECKOUT', cart }));
    }

    fetchMenu();
  </script>
</body>
</html>
